<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERICA 기숙사 스마트 세탁</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SweetAlert2 for nice alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        erica: {
                            50: '#e6f0fa',
                            100: '#cce1f5',
                            500: '#1a75d2',
                            700: '#004c99',
                            900: '#002a5c', // Hanyang Blue base
                            DEFAULT: '#003E7A'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 모바일 웹앱 특화 스타일 */
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh; /* iOS 하단바 대응 */
            background-color: #f9fafb;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 팝업 모달 애니메이션 */
        .bottom-sheet {
            transition: transform 0.3s ease-out;
            transform: translateY(100%);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        .overlay {
            transition: opacity 0.3s ease-out;
            opacity: 0;
            pointer-events: none;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-gray-200">

<div class="app-container">
    
    <!-- 헤더 -->
    <header class="bg-erica text-white p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-2">
            <i class="ph ph-buildings text-2xl"></i>
            <h1 class="font-bold text-lg tracking-wide">창의인재관 세탁소</h1>
        </div>
        <div class="flex items-center gap-3">
            <!-- 발표 시연용 치트키 (빠른 배속 버튼) -->
            <button id="cheatBtn" class="text-xs bg-white/20 px-2 py-1 rounded-full font-bold active:bg-white/40 transition">
                <i class="ph ph-fast-forward"></i> 시연용 배속
            </button>
            <i class="ph ph-bell text-xl relative">
                <span class="absolute -top-1 -right-1 bg-red-500 w-2.5 h-2.5 rounded-full border border-erica"></span>
            </i>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 overflow-y-auto hide-scrollbar pb-20 relative">
        
        <!-- 1. 세탁 탭 (기본 화면) -->
        <div id="tab-laundry" class="p-4 space-y-6">
            
            <!-- 상태 요약 카드 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <h2 class="text-sm text-gray-500 font-medium">1층 공용 세탁실</h2>
                    <p class="text-xl font-bold text-gray-800 mt-1">현재 <span class="text-erica" id="availableCount">0</span>대 사용 가능</p>
                </div>
                <div class="bg-erica-50 text-erica p-3 rounded-full">
                    <i class="ph ph-washing-machine text-2xl"></i>
                </div>
            </div>

            <!-- 세탁기 그리드 -->
            <div>
                <div class="flex justify-between items-end mb-3">
                    <h3 class="font-bold text-gray-800">세탁기 현황</h3>
                    <div class="flex gap-2 text-xs text-gray-500 font-medium">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span>가능</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500"></span>사용중</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-gray-400"></span>점검</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3" id="machineGrid">
                    <!-- JS로 세탁기 렌더링 -->
                </div>
            </div>
            
            <div class="bg-blue-50 text-blue-800 text-sm p-3 rounded-lg flex items-start gap-2">
                <i class="ph ph-info mt-0.5"></i>
                <p>세탁 완료 후 10분 내에 수거하지 않으면, 다음 사용자를 위해 매니저가 수거함으로 이동시킬 수 있습니다.</p>
            </div>
        </div>

        <!-- 2. 지갑/충전 탭 -->
        <div id="tab-wallet" class="p-4 space-y-6 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">내 지갑</h2>
            
            <!-- 내 잔액 카드 -->
            <div class="bg-gradient-to-br from-erica to-erica-700 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <i class="ph ph-wallet absolute -right-4 -bottom-4 text-8xl text-white/10"></i>
                <p class="text-white/80 text-sm mb-1">현재 잔여 포인트</p>
                <div class="flex items-baseline gap-1">
                    <h3 class="text-4xl font-bold" id="balanceDisplay">1,500</h3>
                    <span class="text-lg">P</span>
                </div>
                <div class="mt-6 flex justify-between items-center text-sm">
                    <span>김ERICA (컴퓨터공학과)</span>
                    <span>1P = 1원</span>
                </div>
            </div>

            <!-- 충전하기 버튼들 -->
            <div>
                <h3 class="font-bold text-gray-800 mb-3">포인트 간편 충전</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="recharge(1000)" class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center gap-2 hover:border-erica hover:bg-erica-50 transition shadow-sm">
                        <span class="font-bold text-gray-800">+ 1,000 P</span>
                        <span class="text-xs text-gray-500">기본 세탁 1회</span>
                    </button>
                    <button onclick="recharge(5000)" class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center gap-2 hover:border-erica hover:bg-erica-50 transition shadow-sm">
                        <span class="font-bold text-gray-800">+ 5,000 P</span>
                        <span class="text-xs text-blue-500 font-medium">추천</span>
                    </button>
                    <button onclick="recharge(10000)" class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center gap-2 hover:border-erica hover:bg-erica-50 transition shadow-sm">
                        <span class="font-bold text-gray-800">+ 10,000 P</span>
                        <span class="text-xs text-gray-500">10% 추가 적립</span>
                    </button>
                    <button class="bg-gray-50 border border-gray-200 rounded-xl p-4 flex flex-col items-center gap-2 text-gray-400 cursor-not-allowed">
                        <span class="font-bold">직접 입력</span>
                        <span class="text-xs">준비 중</span>
                    </button>
                </div>
            </div>
            
            <div class="bg-gray-100 rounded-xl p-4 mt-6">
                <h4 class="text-xs font-bold text-gray-500 mb-2">최근 이용 내역</h4>
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center"><i class="ph ph-minus"></i></div>
                            <div>
                                <p class="font-medium text-gray-800">세탁기 2번 사용</p>
                                <p class="text-xs text-gray-400">어제 19:30</p>
                            </div>
                        </div>
                        <span class="font-bold text-gray-800">-1,000 P</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><i class="ph ph-plus"></i></div>
                            <div>
                                <p class="font-medium text-gray-800">카카오페이 충전</p>
                                <p class="text-xs text-gray-400">3일 전</p>
                            </div>
                        </div>
                        <span class="font-bold text-blue-600">+5,000 P</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 하단 네비게이션 바 -->
    <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around pb-6 pt-2 px-2 z-10" style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom));">
        <button onclick="switchTab('laundry')" id="nav-laundry" class="flex flex-col items-center w-16 p-1 text-erica transition">
            <i class="ph-fill ph-washing-machine text-2xl mb-1"></i>
            <span class="text-[10px] font-medium">세탁실</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center w-16 p-1 text-gray-400 hover:text-erica transition">
            <i class="ph ph-wallet text-2xl mb-1"></i>
            <span class="text-[10px] font-medium">내 지갑</span>
        </button>
        <button onclick="showComingSoon('기숙사 커뮤니티')" class="flex flex-col items-center w-16 p-1 text-gray-400 hover:text-erica transition">
            <i class="ph ph-users text-2xl mb-1"></i>
            <span class="text-[10px] font-medium">커뮤니티</span>
        </button>
        <button onclick="showComingSoon('마이페이지')" class="flex flex-col items-center w-16 p-1 text-gray-400 hover:text-erica transition">
            <i class="ph ph-user text-2xl mb-1"></i>
            <span class="text-[10px] font-medium">마이</span>
        </button>
    </nav>

    <!-- 세탁 시작 바텀 시트 (모달) -->
    <div id="overlay" class="overlay absolute inset-0 bg-black/50 z-20" onclick="closeModal()"></div>
    <div id="bottomSheet" class="bottom-sheet absolute bottom-0 w-full bg-white rounded-t-3xl shadow-2xl z-30 flex flex-col pt-2 pb-8 px-5" style="padding-bottom: max(2rem, env(safe-area-inset-bottom));">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800"><span id="modalMachineName" class="text-erica">1번 세탁기</span> 예약하기</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="ph ph-x text-2xl"></i></button>
        </div>
        
        <div class="space-y-4 mb-6">
            <div>
                <label class="text-sm font-bold text-gray-600 mb-2 block">세탁 코스 선택</label>
                <div class="grid grid-cols-2 gap-2">
                    <button class="course-btn active border-2 border-erica bg-erica-50 text-erica rounded-xl p-3 font-bold text-sm transition" onclick="selectCourse(this, 1000, 40)">표준 세탁 (40분)</button>
                    <button class="course-btn border border-gray-200 bg-white text-gray-600 rounded-xl p-3 font-bold text-sm transition" onclick="selectCourse(this, 1500, 60)">이불/대형 (60분)</button>
                </div>
            </div>
            <div class="bg-gray-50 rounded-xl p-4 flex justify-between items-center">
                <span class="text-gray-600 font-medium">결제 금액</span>
                <span id="modalPrice" class="font-bold text-lg text-gray-800">1,000 P</span>
            </div>
        </div>

        <button id="startLaundryBtn" onclick="startLaundry()" class="w-full bg-erica text-white rounded-xl py-4 font-bold text-lg shadow-lg active:bg-erica-700 transition">
            세탁 시작하기
        </button>
    </div>

</div>

<script>
    // --- 상태 관리 (State) ---
    let balance = 1500; // 초기 잔액
    let selectedMachineId = null;
    let selectedCourseTime = 40; // 분 단위
    let selectedCoursePrice = 1000; // 포인트 단위
    
    // 가상의 세탁기 데이터 (초기 상태)
    const machines = [
        { id: 1, name: "1번 세탁기", status: "available", timeRemaining: 0 },
        { id: 2, name: "2번 세탁기", status: "in-use", timeRemaining: 1250 }, // 약 20분
        { id: 3, name: "3번 세탁기", status: "available", timeRemaining: 0 },
        { id: 4, name: "4번 세탁기", status: "in-use", timeRemaining: 300 }, // 5분
        { id: 5, name: "5번 세탁기", status: "broken", timeRemaining: 0 },
        { id: 6, name: "6번 세탁기", status: "available", timeRemaining: 0 },
    ];

    // --- UI 업데이트 함수 ---
    
    // 잔액 렌더링
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').innerText = balance.toLocaleString();
    }

    // 초를 MM:SS 포맷으로 변환
    function formatTime(seconds) {
        if(seconds <= 0) return "00:00";
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // 세탁기 그리드 렌더링
    function renderMachines() {
        const grid = document.getElementById('machineGrid');
        grid.innerHTML = '';
        
        let availableCount = 0;

        machines.forEach(m => {
            let statusBadge = '';
            let cardClasses = 'relative rounded-2xl p-4 border transition-all duration-200 ';
            let onClickAttr = '';

            if (m.status === 'available') {
                availableCount++;
                cardClasses += 'bg-white border-green-200 shadow-sm hover:border-green-500 hover:shadow cursor-pointer';
                statusBadge = `<div class="absolute top-3 right-3 w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>`;
                onClickAttr = `onclick="openModal(${m.id})"`;
            } else if (m.status === 'in-use') {
                cardClasses += 'bg-red-50 border-red-100 opacity-90';
                statusBadge = `<div class="absolute top-3 right-3 text-xs font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded-full animate-pulse">${formatTime(m.timeRemaining)}</div>`;
            } else if (m.status === 'broken') {
                cardClasses += 'bg-gray-100 border-gray-200 opacity-60';
                statusBadge = `<div class="absolute top-3 right-3 w-3 h-3 rounded-full bg-gray-400"></div>`;
            }

            const iconColor = m.status === 'available' ? 'text-green-600' : (m.status === 'in-use' ? 'text-red-400' : 'text-gray-400');
            const statusText = m.status === 'available' ? '사용 가능' : (m.status === 'in-use' ? '동작 중' : '점검 중');
            const statusTextColor = m.status === 'available' ? 'text-green-600' : (m.status === 'in-use' ? 'text-red-500' : 'text-gray-500');

            const cardHTML = `
                <div class="${cardClasses}" ${onClickAttr}>
                    ${statusBadge}
                    <i class="ph ph-washing-machine text-4xl ${iconColor} mb-2"></i>
                    <h4 class="font-bold text-gray-800 text-sm">${m.name}</h4>
                    <p class="text-xs font-medium ${statusTextColor} mt-1">${statusText}</p>
                </div>
            `;
            grid.innerHTML += cardHTML;
        });

        document.getElementById('availableCount').innerText = availableCount;
    }

    // --- 액션 및 로직 ---

    // 탭 전환
    function switchTab(tabName) {
        document.getElementById('tab-laundry').classList.add('hidden');
        document.getElementById('tab-wallet').classList.add('hidden');
        
        document.getElementById('nav-laundry').classList.remove('text-erica');
        document.getElementById('nav-laundry').classList.add('text-gray-400');
        document.getElementById('nav-laundry').querySelector('i').classList.replace('ph-fill', 'ph');
        
        document.getElementById('nav-wallet').classList.remove('text-erica');
        document.getElementById('nav-wallet').classList.add('text-gray-400');
        document.getElementById('nav-wallet').querySelector('i').classList.replace('ph-fill', 'ph');

        document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        
        const activeNav = document.getElementById(`nav-${tabName}`);
        activeNav.classList.remove('text-gray-400');
        activeNav.classList.add('text-erica');
        activeNav.querySelector('i').classList.replace('ph', 'ph-fill');
    }

    // 모달 열기/닫기
    function openModal(machineId) {
        selectedMachineId = machineId;
        const machine = machines.find(m => m.id === machineId);
        document.getElementById('modalMachineName').innerText = machine.name;
        
        // 초기화
        document.querySelectorAll('.course-btn').forEach((btn, index) => {
            if(index === 0) selectCourse(btn, 1000, 40); // 기본 선택
        });

        document.getElementById('overlay').classList.add('open');
        document.getElementById('bottomSheet').classList.add('open');
    }

    function closeModal() {
        document.getElementById('overlay').classList.remove('open');
        document.getElementById('bottomSheet').classList.remove('open');
        selectedMachineId = null;
    }

    // 코스 선택
    function selectCourse(btn, price, time) {
        document.querySelectorAll('.course-btn').forEach(b => {
            b.className = 'course-btn border border-gray-200 bg-white text-gray-600 rounded-xl p-3 font-bold text-sm transition';
        });
        btn.className = 'course-btn active border-2 border-erica bg-erica-50 text-erica rounded-xl p-3 font-bold text-sm transition';
        
        selectedCoursePrice = price;
        selectedCourseTime = time;
        document.getElementById('modalPrice').innerText = `${price.toLocaleString()} P`;
    }

    // 세탁 시작 (핵심 로직)
    function startLaundry() {
        if (balance < selectedCoursePrice) {
            Swal.fire({
                icon: 'error',
                title: '포인트 부족',
                text: '잔액이 부족합니다. 지갑 탭에서 충전해주세요.',
                confirmButtonColor: '#003E7A'
            });
            closeModal();
            return;
        }

        // 결제 및 상태 변경
        balance -= selectedCoursePrice;
        updateBalanceUI();

        const machine = machines.find(m => m.id === selectedMachineId);
        machine.status = 'in-use';
        machine.timeRemaining = selectedCourseTime * 60; // 초 단위

        closeModal();
        renderMachines();

        // 성공 토스트 알림
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: `${machine.name} 작동이 시작되었습니다!`,
            showConfirmButton: false,
            timer: 2000
        });
    }

    // 타이머 루프 (1초마다 실행)
    setInterval(() => {
        let needsRender = false;
        machines.forEach(m => {
            if (m.status === 'in-use' && m.timeRemaining > 0) {
                m.timeRemaining -= 1;
                needsRender = true;
                
                // 세탁 완료 시
                if (m.timeRemaining <= 0) {
                    m.status = 'available';
                    m.timeRemaining = 0;
                    
                    // 푸시 알림 시뮬레이션
                    Swal.fire({
                        title: '🔔 세탁 완료!',
                        text: `${m.name}의 세탁이 완료되었습니다. 다음 사람을 위해 빨래를 수거해주세요.`,
                        icon: 'info',
                        confirmButtonText: '확인',
                        confirmButtonColor: '#003E7A'
                    });
                }
            }
        });

        if (needsRender) renderMachines();
    }, 1000);

    // 포인트 충전 (가상)
    function recharge(amount) {
        // 실제 결제 API 연동하는 척 하는 애니메이션
        let timerInterval;
        Swal.fire({
            title: '결제 진행 중...',
            html: '카카오페이를 호출하고 있습니다.',
            timer: 1500,
            timerProgressBar: true,
            didOpen: () => {
                Swal.showLoading();
            },
            willClose: () => {
                clearInterval(timerInterval);
            }
        }).then((result) => {
            balance += amount;
            updateBalanceUI();
            Swal.fire({
                icon: 'success',
                title: '충전 완료!',
                text: `${amount.toLocaleString()}P가 성공적으로 충전되었습니다.`,
                confirmButtonColor: '#003E7A'
            });
        });
    }

    // 미구현 기능 알림
    function showComingSoon(feature) {
        Swal.fire({
            toast: true,
            position: 'bottom',
            icon: 'info',
            title: `${feature} 기능은 V2에서 업데이트 예정입니다.`,
            showConfirmButton: false,
            timer: 2000
        });
    }

    // 🌟 발표 시연용 치트키 (100배속) 🌟
    document.getElementById('cheatBtn').addEventListener('click', () => {
        let activeCount = 0;
        machines.forEach(m => {
            if (m.status === 'in-use' && m.timeRemaining > 10) {
                m.timeRemaining = 5; // 남은 시간을 5초로 확 줄여버림
                activeCount++;
            }
        });
        
        if (activeCount > 0) {
            Swal.fire({
                toast: true, position: 'top', icon: 'success', 
                title: '[치트키] 실행 중인 세탁기가 5초 뒤 완료됩니다!', 
                showConfirmButton: false, timer: 1500
            });
        } else {
             Swal.fire({
                toast: true, position: 'top', icon: 'warning', 
                title: '현재 실행 중인 세탁기가 없습니다. 먼저 세탁을 시작해주세요.', 
                showConfirmButton: false, timer: 2000
            });
        }
    });
